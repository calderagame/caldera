name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundry-tests:
    name: Foundry tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run forge tests
        working-directory: contracts
        run: forge test -vv
